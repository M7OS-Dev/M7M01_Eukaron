# ostool board run config for Banana Pi BPI-SM10 (board_type "BananaPi").
# U-Boot loads the FIT image at fit_load_addr/bootm_addr, unpacks the kernel
# to kernel_load_addr (0x102200000, matching the linker LMA) and enters it in
# S-mode; OpenSBI stays resident in M-mode. The kernel has no shell, so the
# runner only watches the serial stream for "RME BENCH REPORT OK" or a panic.
board_type = "BananaPi"
kernel_load_addr = "0x102200000"   # kernel load/entry address in the FIT
fit_load_addr = "0x140000000"      # FIT image load address
bootm_addr = "0x140000000"         # bootm command address
timeout = 60                       # serial-watch timeout in seconds

[[shell_check_steps]]
success_regex = [
  "RME BENCH REPORT OK",
]
fail_regex = [
  "(?i)panic",
  "(?i)not syncing",
]
